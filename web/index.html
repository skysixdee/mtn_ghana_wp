  <script>
    window.detectFace = async function () {
      await faceApiReady;
      document.getElementById('snapshot').src = '';
      document.getElementById('snapshot').style.display = 'none';
      document.getElementById('video').style.display = 'block';
      document.getElementById('confirm-text').textContent = '';
      document.getElementById('confirm-modal').style.display = 'none';
      document.getElementById('face-ui').style.display = 'flex';

      await faceapi.nets.tinyFaceDetector.loadFromUri('models');
      await faceapi.nets.faceExpressionNet.loadFromUri('models');
      startFaceDetection();
    };

    async function startFaceDetection() {
      const video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
      video.srcObject = stream;
      await video.play();

      const oldCanvas = document.querySelector('#camera-container canvas');
      if (oldCanvas) oldCanvas.remove();

      const canvas = faceapi.createCanvasFromMedia(video);
      document.getElementById('camera-container').appendChild(canvas);

      const displaySize = { width: video.videoWidth, height: video.videoHeight };
      faceapi.matchDimensions(canvas, displaySize);

      let last = null, lastTime = null, captured = false;
      const interval = setInterval(async () => {
        if (captured) return;

        const detections = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceExpressions();

        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        faceapi.draw.drawDetections(canvas, resizedDetections);
        faceapi.draw.drawFaceExpressions(canvas, resizedDetections);

        if (!detections.length) return;

        const emotion = Object.entries(detections[0].expressions)
          .reduce((a, b) => a[1] > b[1] ? a : b)[0];

        const now = Date.now();
        if (emotion !== last) {
          last = emotion;
          lastTime = now;
        } else if (now - lastTime >= 3000) {
          captured = true;
          captureSnapshot(video, emotion);
          clearInterval(interval);
        }
      }, 300);
    }

    function captureSnapshot(video, emotion) {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      document.getElementById('snapshot').src = canvas.toDataURL('image/png');
      document.getElementById('video').style.display = 'none';
      document.getElementById('snapshot').style.display = 'block';
      document.getElementById('confirm-text').textContent = `Expression: ${emotion}. Confirm?`;
      document.getElementById('confirm-modal').style.display = 'flex';

      document.getElementById('yes-btn').onclick = () => {
        const base64Data = document.getElementById('snapshot').src;
        const expression = emotion;
        document.getElementById('face-ui').style.display = 'none';
        const event = new CustomEvent('expressionCaptured', { detail: 'closed' });
        window.dispatchEvent(event);

        window.parent.postMessage({ type: "uploadFinished" }, "*");
        window.parent.postMessage(
          { type: 'expressionConfirmed', image: base64Data, expression: expression },
          '*'
        );
        event.target.value = "";
        stopVideoStream();

        const oldCanvas = document.querySelector('#camera-container canvas');
        if (oldCanvas) oldCanvas.remove();

        document.getElementById('confirm-modal').style.display = 'none';
      };

      document.getElementById('no-btn').onclick = () => {
        document.getElementById('confirm-modal').style.display = 'none';
        document.getElementById('snapshot').style.display = 'none';
        document.getElementById('video').style.display = 'block';

        const oldCanvas = document.querySelector('#camera-container canvas');
        if (oldCanvas) oldCanvas.remove();

        startFaceDetection();
      };
    }

    function stopVideoStream() {
      const video = document.getElementById('video');
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
    }

    document.getElementById('close-btn').onclick = () => {
      stopVideoStream();

      const oldCanvas = document.querySelector('#camera-container canvas');
      if (oldCanvas) oldCanvas.remove();

      document.getElementById('face-ui').style.display = 'none';
      const event = new CustomEvent('expressionCaptured', { detail: 'closed' });
      window.dispatchEvent(event);
    };
  </script>

  <!-- ✅ Upload & Detect from Image -->
  <script>
    // Guard: resolves when faceapi is confirmed available
    const faceApiReady = new Promise((resolve) => {
      const check = () => (typeof faceapi !== 'undefined' ? resolve() : setTimeout(check, 50));
      check();
    });

    document.getElementById("upload-input").onchange = async (event) => {
      await faceApiReady;
      const file = event.target.files[0];
      if (!file) return;

      window.parent.postMessage({ type: "uploadStarted" }, "*");

      const img = await faceapi.bufferToImage(file);
      await faceapi.nets.tinyFaceDetector.loadFromUri('models');
      await faceapi.nets.faceExpressionNet.loadFromUri('models');

      const detections = await faceapi
        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
        .withFaceExpressions();

      if (!detections) {
        window.parent.postMessage({ type: "uploadFinished" }, "*");
        alert("No face detected!");
        event.target.value = "";
        return;
      }

      const emotion = Object.entries(detections.expressions)
        .reduce((a, b) => (a[1] > b[1] ? a : b))[0];

      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext("2d").drawImage(img, 0, 0);
      const base64Data = canvas.toDataURL("image/png");

      window.parent.postMessage({ type: "uploadFinished" }, "*");

      window.parent.postMessage(
        { type: "expressionConfirmed", image: base64Data, expression: emotion, source: "upload" },
        "*"
      );
    };
  </script>

    console.log(' showNotification() called:', title, body);

    if (!("Notification" in window)) {
      console.log(' Browser does not support notifications');
      return;
    }

    if (Notification.permission === 'granted') {
      navigator.serviceWorker.ready.then((registration) => {
        console.log(' Showing notification via SW');
        registration.showNotification(title, {
          body: body,
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png',
          requireInteraction: false,
        });
      }).catch((err) => {
        console.log(' SW not ready:', err);
        new Notification(title, { body: body });
      });
    } else {
      console.log('Notification permission:', Notification.permission);
