  <!-- Loading Indicator Style -->
  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 1.1em solid rgba(255, 255, 0, 0.208);
      border-right: 1.1em solid rgba(255, 255, 0, 0.508);
      border-bottom: 1.1em solid rgba(255, 255, 0, 0.708);
      border-left: 1.1em solid #ffe100;
      width: 120px;
      height: 120px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

  // ✅ This function is called by Flutter via JS interop
  function showNotification(title, body) {
    console.log('🔔 showNotification() called:', title, body);

    if (!("Notification" in window)) {
      console.log('❌ Browser does not support notifications');
      return;
    }

    if (Notification.permission === 'granted') {
      // Use service worker to show notification (required for PWA)
      navigator.serviceWorker.ready.then((registration) => {
        console.log('✅ Showing notification via SW');
        registration.showNotification(title, {
          body: body,
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png',
          requireInteraction: false,
        });
      }).catch((err) => {
        console.log('❌ SW not ready:', err);
        // Fallback: direct Notification API
        new Notification(title, { body: body });
      });
    } else {
      console.log('❌ Notification permission:', Notification.permission);
    }
  }
</script>
