  <!-- Loading Indicator Style -->
  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 1.1em solid rgba(255, 255, 0, 0.208);
      border-right: 1.1em solid rgba(255, 255, 0, 0.508);
      border-bottom: 1.1em solid rgba(255, 255, 0, 0.708);
      border-left: 1.1em solid #ffe100;
      width: 120px;
      height: 120px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="loading">
    <div class="loader"></div>
  </div>

  <!-- Main Flutter script -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
